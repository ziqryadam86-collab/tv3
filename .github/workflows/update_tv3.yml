name: Auto Update TV3 M3U8

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-m3u8:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch & Generate tv3.m3u8
        run: |
          # 1. Ambil data REST API dengan User-Agent Chrome Desktop
          RAW_RESPONSE=$(curl -sL "https://tv3live.my/wp-json/media-hub/v1/bootstrap?provider=tonton&channel=tv3&quality=main" \
            -H "Referer: https://tv3live.my/tv3/" \
            -H "Origin: https://tv3live.my" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36")

          # 2. Nyahkod triple base64
          DECODED_DATA=$(echo "$RAW_RESPONSE" | tr -d '"' | base64 -d 2>/dev/null | base64 -d 2>/dev/null | base64 -d 2>/dev/null)

          # 3. Ekstrak URL .m3u8
          STREAM_URL=$(echo "$DECODED_DATA" | grep -oE 'https://[^"]+' | sed 's/\\//g')

          # Semakan sekiranya pembolehubah kosong
          if [ -z "$STREAM_URL" ]; then
            echo "Kandungan asal yang diterima: $RAW_RESPONSE"
            echo "Gagal mendapatkan STREAM_URL!"
            exit 1
          fi

          echo "URL Berjaya Ditemui: $STREAM_URL"

          # 4. Simpan terus ke tv3.m3u8
          echo "#EXTM3U" > tv3.m3u8
          echo '#EXT-X-STREAM-INF:BANDWIDTH=3405200,CODECS="avc1.4d001f,mp4a.40.2",RESOLUTION=1280x720' >> tv3.m3u8
          echo "$STREAM_URL" >> tv3.m3u8

      - name: Commit & Push Update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add tv3.m3u8
          git commit -m "Update tv3.m3u8 stream URL [skip ci]" || exit 0
          git push
          
