name: Auto Update TV3 M3U8

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-m3u8:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch & Generate tv3.m3u8
        run: |
          python3 -c '
          import urllib.request
          import json
          import base64
          import re

          url = "https://tv3live.my/wp-json/media-hub/v1/bootstrap?provider=tonton&channel=tv3&quality=main"
          headers = {
              "Referer": "https://tv3live.my/tv3/",
              "Origin": "https://tv3live.my",
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
          }

          req = urllib.request.Request(url, headers=headers)
          response = urllib.request.urlopen(req)
          data = response.read().decode("utf-8").strip().strip("\"")

          # Decode Base64 3 kali
          for _ in range(3):
              data = base64.b64decode(data).decode("utf-8")

          json_data = json.loads(data)
          stream_url = json_data.get("url", "")

          if not stream_url:
              raise Exception("URL stream tidak dijumpai dalam JSON!")

          print(f"URL Berjaya Ditemui: {stream_url}")

          # Pembolehubah Header
          referer = "https://tv3live.my/tv3/"
          user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"

          # Format M3U8 Ringkas
          content = (
              "#EXTM3U\n"
              f"#EXTVLCOPT:http-referrer={referer}\n"
              f"#EXTVLCOPT:http-user-agent={user_agent}\n"
              f"#EXT-X-STREAM-INF:BANDWIDTH=3405200,RESOLUTION=1280x720\n"
              f"{stream_url}\n"
          )

          with open("tv3.m3u8", "w") as f:
              f.write(content)
          '

      - name: Commit & Push Update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add tv3.m3u8
          git commit -m "Update tv3.m3u8 stream URL [skip ci]" || exit 0
          git push
          
